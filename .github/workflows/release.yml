name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build executable
        run: pyinstaller --noconfirm monitor_input_switcher.spec

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Create zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/MonitorInputSwitcher-v$version-win64.zip"
          Compress-Archive -Path "dist/MonitorInputSwitcher.exe" -DestinationPath $zip
          echo "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MonitorInputSwitcher.exe
            dist/MonitorInputSwitcher-v${{ steps.version.outputs.version }}-win64.zip
