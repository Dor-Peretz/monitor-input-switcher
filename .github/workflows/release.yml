name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches version.py
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'from version import __version__; print(__version__)')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py (expected v$version)"
            exit 1
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build executable
        run: pyinstaller --noconfirm monitor_input_switcher.spec

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Create zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/MonitorInputSwitcher-v$version-win64.zip"
          Compress-Archive -Path "dist/MonitorInputSwitcher.exe" -DestinationPath $zip
          echo "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MonitorInputSwitcher.exe
            dist/MonitorInputSwitcher-v${{ steps.version.outputs.version }}-win64.zip

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Package macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          staging="MonitorInputSwitcher-macos-v$version"
          mkdir -p "$staging"
          cp macos/*.py macos/*.sh macos/requirements.txt macos/README.md macos/config.example.json "$staging"/
          # menu_bar_app.py imports switch_progress from streamdeck/<plugin>/ next to it.
          rsync -a --exclude '__pycache__/' --exclude '*.pyc' --exclude '.DS_Store' \
            macos/streamdeck/ "$staging/streamdeck/"
          test -f "$staging/streamdeck/com.dorperetz.monitorswitcher.sdPlugin/switch_progress.py"
          test -x "$staging/streamdeck/install.sh"
          zip -r "$staging.zip" "$staging"
          echo "ZIP_PATH=$staging.zip" >> "$GITHUB_ENV"

      - name: Upload macOS bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
