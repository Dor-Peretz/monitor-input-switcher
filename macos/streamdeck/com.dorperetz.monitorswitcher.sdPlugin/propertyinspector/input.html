<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Toggle Monitor Input</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font: 13px -apple-system, system-ui, sans-serif;
        color: #d8d8d8;
        background: #2d2d2d;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .label {
        flex: 0 0 82px;
        text-align: right;
        color: #969696;
      }
      select {
        flex: 1 1 auto;
        min-width: 0;
        padding: 4px 6px;
        color: #d8d8d8;
        background: #3d3d3d;
        border: 1px solid #1b1b1b;
        border-radius: 4px;
      }
      .hint {
        margin-left: 90px;
        color: #7f7f7f;
        font-size: 11px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="label">Monitor</span>
      <select id="target"></select>
    </div>
    <p class="hint">
      Monitors and their two inputs come from the Monitor Input Switcher
      settings. Add or edit them there, then reopen this panel.
    </p>
    <script src="input.js"></script>
  </body>
</html>
